[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jed-validator"
version = "0.1.0"
description = "Kaggle GPU validation and local scoring for the JED red-team benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JED validator contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
jed-validate = "jed_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jed_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["kaggle_integration: opt-in test that consumes Kaggle GPU quota"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["jed_validator"]
